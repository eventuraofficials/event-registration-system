<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Facilitator Check-In</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/boh-favicon.svg">
    <link rel="stylesheet" href="../css/boh-ui.css">
    <style>
        :root { --primary: #ff4d00; --ink: #0a0a0a; --muted: #606060; --line: #dedede; --bg: #f3f3f1; --danger: #b42318; --success: #166534; --success-bg: #f1f1ef; }
        * { box-sizing: border-box; } body { margin: 0; color: var(--ink); background: radial-gradient(circle at 12% 0%, #d9f3e8 0, transparent 27rem), var(--bg); font-family: "Trebuchet MS", ui-sans-serif, sans-serif; }
        button, input { font: inherit; } button { min-height: 54px; padding: 0 18px; border: 0; border-radius: 10px; color: #fff; background: var(--primary); font-weight: 800; cursor: pointer; touch-action: manipulation; transition: transform .18s ease, filter .18s ease; } button:hover { filter: brightness(1.08); transform: translateY(-1px); } button:disabled { opacity: .55; cursor: wait; } button.secondary { color: var(--ink); background: #fff; border: 1px solid var(--line); } button.danger { background: var(--danger); }
        .topbar { color: #fff; background: var(--ink); box-shadow: 0 3px 18px #102a2c1f; } .topbar-inner, .main { width: min(100% - 32px, 980px); margin: auto; } .topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 72px; } .brand { display: flex; align-items: center; gap: 10px; font-weight: 850; letter-spacing: .01em; } .brand-logo { width: 42px; height: 42px; padding: 4px; object-fit: contain; border-radius: 12px; background: #fff; }
        .main { padding: 22px 0 56px; } .event-head { display: flex; align-items: center; gap: 18px; padding: 28px 0 24px; } .event-head h1 { margin: 0 0 8px; font-size: clamp(1.9rem, 5vw, 3.5rem); line-height: .96; letter-spacing: -.055em; } .event-head p { margin: 0; color: var(--muted); } .event-logo { width: 82px; height: 82px; padding: 8px; object-fit: contain; border-radius: 14px; background: #fff; box-shadow: 0 8px 22px #102a2c12; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; } .stat { padding: 17px 15px; border: 1px solid var(--line); border-radius: 11px; background: #fff; box-shadow: 0 8px 24px #102a2c08; } .stat strong { display: block; color: var(--primary); font-size: clamp(1.4rem, 5vw, 2.2rem); letter-spacing: -.04em; } .stat span { color: var(--muted); font-size: .7rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
        .actions { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 10px; margin-bottom: 18px; } .actions button:first-child { min-height: 76px; font-size: 1.08rem; box-shadow: 0 8px 20px color-mix(in srgb, var(--primary) 24%, transparent); }
        .panel { padding: 20px; border: 1px solid var(--line); border-radius: 13px; background: #fff; box-shadow: 0 8px 25px #102a2c08; } .panel h2 { margin: 0 0 15px; font-size: 1.08rem; letter-spacing: -.02em; } .hidden { display: none !important; }
        #reader { min-height: 270px; overflow: hidden; border-radius: 11px; background: #07191b; } .scanner-note { margin: 11px 0 0; color: var(--muted); font-size: .82rem; text-align: center; }
        .search-row { display: flex; gap: 8px; } input { width: 100%; min-height: 54px; padding: 0 14px; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; background: #fbfdfc; } input:focus { outline: 3px solid var(--primary); border-color: var(--primary); } .guest-list { display: grid; gap: 8px; margin-top: 14px; } .guest { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 9px; } .guest strong, .guest small { display: block; } .guest small { color: var(--muted); } .guest button { min-height: 46px; padding: 0 12px; }
        .result { margin-top: 14px; padding: 19px; border-left: 5px solid var(--success); border-radius: 10px; background: var(--success-bg); color: var(--success); } .result.error { border-left-color: var(--danger); color: var(--danger); background: #fef2f2; } .result h3 { margin: 0 0 9px; font-size: 1.1rem; letter-spacing: .02em; } .result p { margin: 4px 0; color: inherit; } .result-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
        .notice { margin-bottom: 14px; padding: 13px 15px; border-radius: 9px; color: var(--danger); background: #fef2f2; } .portal-login { max-width: 430px; margin: 80px auto; } .portal-login h1 { margin-top: 0; } .portal-login label { display: block; margin: 12px 0 6px; font-size: .85rem; font-weight: 700; }
        @media (max-width: 700px) { .topbar-inner, .main { width: min(100% - 24px, 980px); } .stats { grid-template-columns: repeat(2, 1fr); } .actions { grid-template-columns: 1fr 1fr; } .actions button:first-child { grid-column: 1 / -1; } .guest { align-items: flex-start; flex-direction: column; } .guest button { width: 100%; } }
    </style>
</head>
<body class="boh-page">
<header class="topbar"><div class="topbar-inner"><div class="brand"><img id="clientLogo" class="brand-logo hidden" alt="Client logo"><span id="brandName">Facilitator Portal</span></div><button id="signOut" class="secondary" type="button">Sign out</button></div></header>
<section id="loginGate" class="main portal-login panel"><h1>Facilitator Access</h1><p>Use the event-specific access link provided by the event administrator.</p></section>
<main id="facilitatorApp" class="main hidden">
    <div id="notice" class="notice hidden"></div>
    <section class="event-head"><img id="eventLogo" class="event-logo hidden" alt="Event logo"><div><h1 id="eventName">Loading...</h1><p id="eventDetails"></p></div></section>
    <section class="stats" aria-label="Attendance summary"><div class="stat"><strong id="registered">0</strong><span>Total registered</span></div><div class="stat"><strong id="checkedIn">0</strong><span>Total checked in</span></div><div class="stat"><strong id="remaining">0</strong><span>Remaining</span></div><div class="stat"><strong id="rate">0%</strong><span>Attendance rate</span></div></section>
    <nav class="actions" aria-label="Facilitator actions"><button id="scanAction" type="button">Scan guest QR</button><button id="searchAction" class="secondary" type="button">Search guest</button><button id="listAction" class="secondary" type="button">Registered guests</button></nav>
    <section id="scannerPanel" class="panel"><h2>Scan guest QR</h2><div id="reader"></div><p class="scanner-note">Hold the guest QR code inside the frame. The ticket must belong to this event.</p><div id="scanResult"></div></section>
    <section id="searchPanel" class="panel hidden"><h2>Search guest</h2><div class="search-row"><input id="searchInput" type="search" placeholder="Name, email, company, or guest code" aria-label="Search guests"><button id="searchButton" type="button">Search</button></div><div id="guestList" class="guest-list"></div></section>
</main>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="../js/pages/facilitator.js"></script>
</body>
</html>
